name: Bot Discord

# Plan B gratuit, sans hébergeur : GitHub lance le bot lui-même.
# Chaque exécution tourne 6 h maximum, puis la suivante prend le relais.
# Il faut ajouter DISCORD_TOKEN, CLIENT_ID et GUILD_ID dans
# Settings > Secrets and variables > Actions > New repository secret.

on:
  workflow_dispatch:
  schedule:
    # Toutes les 6 heures
    - cron: '0 */6 * * *'

# Une seule exécution à la fois : deux bots connectés = double réponse.
concurrency:
  group: bot-discord
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        run: npm install

      - name: Lancer le bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
        run: npm start
