name: Bot Discord

# GitHub lance le bot lui-même, gratuitement, sans hébergeur.
# Une exécution dure 6 h maximum : pour éviter un trou entre deux exécutions,
# le planning relance toutes les 4 h et `cancel-in-progress` remplace l'ancienne
# exécution par la nouvelle. Le bot n'est donc hors ligne que le temps du
# redémarrage (environ une minute), au lieu de 10 à 60 minutes d'attente.
# Il faut ajouter DISCORD_TOKEN, CLIENT_ID et GUILD_ID dans
# Settings > Secrets and variables > Actions > New repository secret.

on:
  # Un push sur main = mise à jour du bot : l'ancienne exécution est remplacée.
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Toutes les 4 heures (l'exécution en cours est remplacée avant sa fin).
    - cron: '0 */4 * * *'

# Une seule exécution à la fois : deux bots connectés = double réponse.
concurrency:
  group: bot-discord
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Vérifier les secrets
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
        run: |
          if [ -z "$DISCORD_TOKEN" ]; then
            echo "::error::Secret DISCORD_TOKEN manquant. Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
          if [ -z "$CLIENT_ID" ]; then
            echo "::error::Secret CLIENT_ID manquant. Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
          echo "Secrets présents : DISCORD_TOKEN (${#DISCORD_TOKEN} caractères), CLIENT_ID=$CLIENT_ID"

      - name: Installer les dépendances
        run: npm install

      - name: Lancer le bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
        run: npm start
